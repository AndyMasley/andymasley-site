<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" role="img" font-family="Georgia, Cambria, 'Times New Roman', Times, serif">
  <title>Daily US water use by sector, millions of gallons per day</title>
  <rect width="720" height="446" fill="#ffffff"/>
  <line x1="312.0" y1="12" x2="312.0" y2="408" stroke="#1a1a1a" stroke-width="1"/>
  <text x="312.0" y="422" font-size="10" fill="#666666" text-anchor="middle">0</text>
  <line x1="400.9" y1="12" x2="400.9" y2="408" stroke="#e5e5e5" stroke-width="1"/>
  <text x="400.9" y="422" font-size="10" fill="#666666" text-anchor="middle">1,000</text>
  <line x1="489.8" y1="12" x2="489.8" y2="408" stroke="#e5e5e5" stroke-width="1"/>
  <text x="489.8" y="422" font-size="10" fill="#666666" text-anchor="middle">2,000</text>
  <line x1="578.7" y1="12" x2="578.7" y2="408" stroke="#e5e5e5" stroke-width="1"/>
  <text x="578.7" y="422" font-size="10" fill="#666666" text-anchor="middle">3,000</text>
  <line x1="667.6" y1="12" x2="667.6" y2="408" stroke="#e5e5e5" stroke-width="1"/>
  <text x="667.6" y="422" font-size="10" fill="#666666" text-anchor="middle">4,000</text>
  <text x="300" y="26.5" font-size="11" fill="#333333" text-anchor="end">Thermoelectric power (evaporative/consumptive)</text>
  <rect x="312" y="16" width="383.1" height="14" fill="#8a8a8a"/>
  <text x="690.1" y="26.5" font-size="10.5" fill="#ffffff" text-anchor="end">4,310</text>
  <text x="300" y="52.5" font-size="11" fill="#333333" text-anchor="end">Mining</text>
  <rect x="312" y="42" width="355.6" height="14" fill="#8a8a8a"/>
  <text x="672.6" y="52.5" font-size="10.5" fill="#666666">4,000</text>
  <text x="300" y="78.5" font-size="11" fill="#333333" text-anchor="end">Forest products</text>
  <rect x="312" y="68" width="355.6" height="14" fill="#8a8a8a"/>
  <text x="672.6" y="78.5" font-size="10.5" fill="#666666">4,000</text>
  <text x="300" y="104.5" font-size="11" fill="#333333" text-anchor="end">Household leaks (indoor)</text>
  <rect x="312" y="94" width="219.2" height="14" fill="#8a8a8a"/>
  <text x="536.2" y="104.5" font-size="10.5" fill="#666666">2,466</text>
  <text x="300" y="130.5" font-size="11" fill="#333333" text-anchor="end">Livestock</text>
  <rect x="312" y="120" width="177.8" height="14" fill="#8a8a8a"/>
  <text x="494.8" y="130.5" font-size="10.5" fill="#666666">2,000</text>
  <text x="300" y="156.5" font-size="11" fill="#333333" text-anchor="end">Steel</text>
  <rect x="312" y="146" width="160.0" height="14" fill="#8a8a8a"/>
  <text x="477.0" y="156.5" font-size="10.5" fill="#666666">1,800</text>
  <text x="300" y="182.5" font-size="11" fill="#333333" text-anchor="end">Golf courses</text>
  <rect x="312" y="172" width="133.3" height="14" fill="#8a8a8a"/>
  <text x="450.3" y="182.5" font-size="10.5" fill="#666666">1,500</text>
  <text x="300" y="203" font-size="11" fill="#333333" text-anchor="end">1% of America's daily consumptive</text>
  <text x="300" y="214.5" font-size="11" fill="#333333" text-anchor="end">freshwater withdrawals</text>
  <rect x="312" y="198" width="117.3" height="14" fill="#1a1a1a"/>
  <text x="434.3" y="208.5" font-size="10.5" fill="#666666">1,320</text>
  <text x="300" y="234.5" font-size="11" fill="#333333" text-anchor="end">New York City residential + commercial</text>
  <rect x="312" y="224" width="88.9" height="14" fill="#8a8a8a"/>
  <text x="405.9" y="234.5" font-size="10.5" fill="#666666">1,000</text>
  <text x="300" y="260.5" font-size="11" fill="#333333" text-anchor="end">Phoenix residential + commercial use</text>
  <rect x="312" y="250" width="24.9" height="14" fill="#8a8a8a"/>
  <text x="341.9" y="260.5" font-size="10.5" fill="#666666">280</text>
  <text x="300" y="286.5" font-size="11" fill="#333333" text-anchor="end">Crude oil refining</text>
  <rect x="312" y="276" width="24.0" height="14" fill="#8a8a8a"/>
  <text x="341.0" y="286.5" font-size="10.5" fill="#666666">270</text>
  <text x="300" y="312.5" font-size="11" fill="#333333" text-anchor="end" font-weight="bold">Data centers (onsite + offsite)</text>
  <rect x="312" y="302" width="22.2" height="14" fill="#1f5a7a"/>
  <text x="339.2" y="312.5" font-size="10.5" fill="#666666">250</text>
  <text x="300" y="338.5" font-size="11" fill="#333333" text-anchor="end" font-weight="bold">Data centers (onsite)</text>
  <rect x="312" y="328" width="4.4" height="14" fill="#1f5a7a"/>
  <text x="321.4" y="338.5" font-size="10.5" fill="#666666">50</text>
  <text x="300" y="364.5" font-size="11" fill="#333333" text-anchor="end">U.S. bottled water consumption</text>
  <rect x="312" y="354" width="4.0" height="14" fill="#8a8a8a"/>
  <text x="321.0" y="364.5" font-size="10.5" fill="#666666">44.9</text>
  <text x="300" y="390.5" font-size="11" fill="#333333" text-anchor="end" font-weight="bold">AI in data centers (onsite)</text>
  <rect x="312" y="380" width="1.5" height="14" fill="#1f5a7a"/>
  <text x="318.5" y="390.5" font-size="10.5" fill="#666666">11</text>
  <text x="712" y="438" font-size="10.5" fill="#666666" text-anchor="end">Millions of gallons per day</text>
  <text x="2" y="438" font-size="10" fill="#999999">andymasley.com</text>
</svg>
